<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Recipe Labs</title>
    <meta name="description" content="Page not found. Let's get you back on track.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23F5D547'/%3E%3Cstop offset='100%25' style='stop-color:%234A7C4E'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect fill='%230f1410' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='url(%23g)' font-family='Arial Black' font-size='55' font-weight='900'%3ERL%3C/text%3E%3C/svg%3E">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-bg: #0f1410;
            --color-bg-light: #141a16;
            --color-bg-card: #1a211c;
            --color-lemon: #F5D547;
            --color-lemon-light: #F7E07A;
            --color-lemon-dark: #D4B83A;
            --color-forest: #4A7C4E;
            --color-mint: #9AA590;
            --color-text: #ffffff;
            --color-text-muted: #a8b4a4;
            --color-border: rgba(245, 213, 71, 0.15);
            --gradient-brand: linear-gradient(135deg, #F5D547 0%, #D4B83A 50%, #4A7C4E 100%);
            --gradient-glow: radial-gradient(ellipse at center, rgba(245, 213, 71, 0.15) 0%, transparent 70%);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Tech Overlay */
        .tech-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        .tech-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(245, 213, 71, 0.01) 2px,
                rgba(245, 213, 71, 0.01) 4px
            );
        }

        .tech-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(245, 213, 71, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(245, 213, 71, 0.02) 0%, transparent 50%);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 1rem 2rem;
            transition: all 0.4s ease;
            background: rgba(13, 15, 12, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border);
        }

        .navbar-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-brand);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1rem;
            color: var(--color-bg);
            box-shadow: 0 4px 20px rgba(245, 213, 71, 0.3);
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-menu {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-menu a {
            font-family: var(--font-tech);
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--color-text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gradient-brand);
            transition: width 0.3s ease;
        }

        .nav-menu a:hover {
            color: var(--color-lemon);
        }

        .nav-menu a:hover::after {
            width: 100%;
        }

        .mobile-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .mobile-toggle span {
            width: 25px;
            height: 2px;
            background: var(--color-lemon);
            transition: all 0.3s ease;
        }

        /* Error Page */
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 6rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .error-page::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: var(--gradient-glow);
            border-radius: 50%;
            pointer-events: none;
        }

        .error-content {
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(8rem, 20vw, 14rem);
            font-weight: 900;
            line-height: 1;
            background: var(--gradient-brand);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            text-shadow: 0 0 60px rgba(245, 213, 71, 0.3);
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(2px, -2px);
            }
            96% {
                transform: translate(-2px, -2px);
            }
            98% {
                transform: translate(2px, 2px);
            }
        }

        .error-title {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--color-lemon);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .error-description {
            font-family: var(--font-body);
            font-size: 1.125rem;
            color: var(--color-text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .error-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            font-family: var(--font-tech);
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.4s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--gradient-brand);
            color: var(--color-bg);
            box-shadow: 0 4px 20px rgba(245, 213, 71, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(245, 213, 71, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-lemon);
            border: 2px solid var(--color-lemon);
        }

        .btn-secondary:hover {
            background: rgba(245, 213, 71, 0.1);
            transform: translateY(-3px);
        }

        /* Decorative Elements */
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
        }

        .grid-lines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: var(--color-lemon);
        }

        .grid-lines::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--color-lemon);
        }

        /* Brand Spectrum */
        .brand-spectrum {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-brand);
            z-index: 100;
        }

        /* Footer */
        .footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid var(--color-border);
            background: var(--color-bg);
            position: absolute;
            bottom: 4px;
            width: 100%;
        }

        .footer p {
            font-family: var(--font-tech);
            font-size: 0.85rem;
            color: var(--color-text-muted);
            letter-spacing: 1px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-menu {
                position: fixed;
                top: 70px;
                left: 0;
                width: 100%;
                flex-direction: column;
                background: rgba(13, 15, 12, 0.98);
                padding: 2rem;
                gap: 1.5rem;
                transform: translateY(-100%);
                opacity: 0;
                pointer-events: none;
                transition: all 0.4s ease;
                border-bottom: 1px solid var(--color-border);
            }

            .nav-menu.active {
                transform: translateY(0);
                opacity: 1;
                pointer-events: all;
            }

            .mobile-toggle {
                display: flex;
            }

            .error-code {
                font-size: clamp(6rem, 25vw, 10rem);
            }

            .error-buttons {
                flex-direction: column;
                align-items: center;
            }

            .btn-primary, .btn-secondary {
                width: 100%;
                max-width: 250px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Tech Overlay -->
    <div class="tech-overlay"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon">RL</div>
                <span class="logo-text">RECIPE LABS</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Work</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="mobile-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Error Page -->
    <section class="error-page">
        <div class="grid-lines"></div>
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-description">
                The page you're looking for doesn't exist or has been moved.
                Let's get you back on track and explore what we can create together.
            </p>
            <div class="error-buttons">
                <a href="index.html" class="btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Go Home
                </a>
                <a href="contact.html" class="btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Contact Us
                </a>
            </div>
        </div>
    </section>

    <!-- Brand Spectrum -->
    <div class="brand-spectrum"></div>

    <script>
        // Mobile menu toggle
        const mobileToggle = document.querySelector('.mobile-toggle');
        const navMenu = document.querySelector('.nav-menu');

        mobileToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            mobileToggle.classList.toggle('active');
        });

        // Close menu when clicking a link
        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                mobileToggle.classList.remove('active');
            });
        });
    </script>
</body>
</html>
